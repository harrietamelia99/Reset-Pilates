# Production builds when GitHub notifies Vercel (Settings → Git). If that breaks:
# 1) Vercel → Project → Settings → Git → Deploy Hooks (branch main) → copy URL
# 2) GitHub repo → Settings → Secrets → Actions → VERCEL_DEPLOY_HOOK_URL = that URL
# Or: Actions tab → "Trigger Vercel deploy" → Run workflow (manual).
name: Trigger Vercel deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: POST deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning title=Vercel deploy hook missing::GitHub does not see secret VERCEL_DEPLOY_HOOK_URL. Add it under repo Settings → Secrets and variables → Actions (Repository secrets, exact name). Environment-only secrets are ignored unless the workflow uses that environment."
            exit 0
          fi
          echo "Hook secret is present (${#HOOK} characters)."
          HTTP=$(curl -sS -o /tmp/hook_body -w "%{http_code}" -X POST "$HOOK")
          echo "Response HTTP status: $HTTP"
          head -c 500 /tmp/hook_body 2>/dev/null || true
          echo ""
          if [ "$HTTP" -ge 200 ] 2>/dev/null && [ "$HTTP" -lt 300 ] 2>/dev/null; then
            echo "Deploy hook accepted."
          else
            echo "::error::Deploy hook did not return success (expected HTTP 2xx). Regenerate the hook in Vercel → Settings → Git → Deploy Hooks and update the secret."
            exit 1
          fi
